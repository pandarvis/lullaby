appId: com.pandarvis.lullaby
productName: Lullaby
directories:
  output: dist
electronDist: node_modules/electron/dist
asar: false
npmRebuild: false
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/tests/**'
  - '!**/test/**'
win:
  target:
    - target: dir
      arch: [x64]
  signAndEditExecutable: false
